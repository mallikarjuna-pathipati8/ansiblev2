- name: Launch an EC2 instance
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    region: us-east-1
    instance_type: t3.small
    image_id: ami-0055977a6e828a4f4 # Replace with your target AMI ID
    instnace: ["mongodb", "redis"]
    action: create
    domain_name: "arjundaws2s.store"
    hosted_zone: "Z08325212T4ZKWPRKKKQC"

  tasks:
    - name: Create EC2 instance
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        region: "{{ region }}"
        instance_type: "{{ instance_type }}"
        security_groups:
          - roboshop-common
          - "roboshop-{{ item }}"
        image_id: "{{ image_id }}"
      loop: "{{ instnace }}"
      when: action =="create"
      register: ec2_output

    - name: Create or update Route 53 A record
      amazon.aws.route53:
        state: present
        zone: "{{ hosted_zone }}"
        record: "{{item.item}}.{{ domain_name }}"
        type: A
        ttl: 300
        value: "{{ ec2_output.instances[0].private_ip_address }}"
        wait: true
      loop: "{{ ec2_output.results }}"
      when: action == "create"
