- name: configure cart server
  hosts: cart
  become: yes
  tasks:
    - name: disable default nodejs 16 version
      command: dnf module disable nodejs -y

    - name: enable nodejs 24 version
      command: dnf module enable nodejs:24 -y

    - name: install nodejs
      package:
        name: "{{ app_name }}"
        state: present

    - name: create system user
      user:
        name: roboshop
        create_home: false
        home: /app
        system: true
        shell: /sbin/nologin
        comment: "roboshop system user"

    - name: remove existing /app directory
      file:
        path: /app
        state: absent

    - name: remove existing cart project
      file:
        path: /tmp/cart.zip
        state: absent

    - name: create app directory
      file:
        path: /app
        state: directory

    - name: download cart application
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/cart-{{ app_version }}.zip
        dest: /tmp/cart.zip

    - name: unzip cart project
      unarchive:
        src: /tmp/cart.zip
        dest: /app
        remote_src: yes

    - name: install npm dependencies
      community.general.npm:
        path: /app

    - name: copy cart service file
      template:
        src: cart.service.j2
        dest: /etc/systemd/system/cart.service

    - name: daemon reload
      systemd_service:
        daemon_reload: yes

    - name: enable and start cart
      service:
        name: cart
        state: restarted
        enabled: yes
